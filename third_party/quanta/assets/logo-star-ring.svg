<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#141e33"/>
      <stop offset="1" stop-color="#090e1a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b983f7"/>
      <stop offset="1" stop-color="#4d9fff"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e7ff"/>
      <stop offset="0.45" stop-color="#b983f7"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="cap" cx="35%" cy="35%" r="80%">
      <stop offset="0" stop-color="#d2b8ff"/>
      <stop offset="1" stop-color="#4d9fff"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 背景星尘 -->
  <g fill="#8b949e">
    <circle cx="96" cy="96" r="2.5" opacity="0.4"/>
    <circle cx="430" cy="76" r="2" opacity="0.35"/>
    <circle cx="452" cy="330" r="2.5" opacity="0.3"/>
    <circle cx="70" cy="380" r="2" opacity="0.35"/>
    <circle cx="390" cy="448" r="2" opacity="0.3"/>
    <circle cx="150" cy="452" r="2.5" opacity="0.3"/>
  </g>

  <!-- 轨道虚线 -->
  <ellipse cx="256" cy="256" rx="132" ry="50" fill="none" stroke="#8b949e"
           stroke-opacity="0.35" stroke-width="3" stroke-dasharray="5 9"
           transform="rotate(-16 256 256)"/>

  <!-- 环形进度：70% -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1a2233" stroke-width="40"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="40"
          stroke-linecap="round" stroke-dasharray="659.7 942.5"
          transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- 进度端点节点 -->
  <circle cx="256" cy="106" r="24" fill="url(#cap)" filter="url(#softglow)"/>
  <circle cx="256" cy="106" r="12" fill="#e6edf3"/>

  <!-- 轨道星点 -->
  <circle cx="352" cy="212" r="9" fill="#79b8ff" filter="url(#softglow)"/>
  <circle cx="170" cy="300" r="7" fill="#a371f7"/>

  <!-- 中心四角星：辉光层 + 渐变主体 -->
  <g filter="url(#glow)">
    <path d="M 256 168 Q 272 240 344 256 Q 272 272 256 344 Q 240 272 168 256 Q 240 240 256 168 Z"
          fill="url(#star)"/>
  </g>
</svg>
