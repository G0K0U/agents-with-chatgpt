<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quanta · 添加连接</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101318;color:#f0f3f8;font:13px -apple-system,sans-serif;padding:24px}h1{font-size:21px;margin:0 0 9px}p{color:#9ca8b8;line-height:1.6;margin:0 0 18px}label{display:block;margin:16px 0 7px;font-weight:600}select,input,button{font:inherit;color:inherit;border:1px solid #36414f;border-radius:8px;background:#1c2430;padding:10px;width:100%}input{font-size:14px}button{cursor:pointer;background:#284974;margin-top:20px}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid #85b6ff;outline-offset:2px}.status{font-size:12px;padding:10px 12px;background:#1c2430;border-radius:8px;margin:18px 0}.status{border:1px solid #36414f;text-align:center;font-family:"SFMono-Regular",Menlo,Monaco,"Hiragino Sans GB",monospace;font-size:12px;font-weight:600;letter-spacing:1px;line-height:1.5}.status.connected{background:#153a29;border-color:#2d8053;color:#a6edbd}.status.disconnected{background:#3b2025;border-color:#944653;color:#ffb5be}.status.pending{background:#1c2430;border-color:#455166;color:#c4cfdf}.note{font-size:11px;margin:10px 0;color:#9ca8b8}#result{line-height:1.6;margin-top:14px;white-space:pre-wrap}[hidden]{display:none!important}
details{margin:12px 0 0;padding:10px 12px;border:1px solid #36414f;border-radius:8px}summary{cursor:pointer;font-size:12px;color:#b9d3f5}ol{padding-left:18px;margin:9px 0 4px;font-size:11px;color:#b8c4d2;line-height:1.7}.key-page{background:transparent;color:#a7ccff;margin-top:10px;padding:8px;font-size:12px}#key-result{font-size:11px;color:#9ca8b8;line-height:1.5;margin-top:7px}
</style></head><body><h1>添加连接</h1><p>连接你的账户，查看官方额度或 API 余额。这里列出的是支持的服务，不表示本机已检测到它们。</p>
<label for="provider">服务</label><select id="provider"><option value="glm">GLM Coding Plan</option><option value="deepseek">DeepSeek API</option></select>
<div id="region"><label for="platform">服务区域</label><select id="platform"><option value="zai">Z.ai（国际）</option><option value="bigmodel">智谱 BigModel（中国）</option></select></div>
<div class="status disconnected" id="status" role="status" aria-live="polite">未连接</div><label for="secret" id="secret-label">API 密钥</label><input id="secret" type="password" autocomplete="new-password" spellcheck="false" autocapitalize="none" maxlength="4096" placeholder="粘贴密钥；已保存的密钥不会显示">
<div class="note" id="destination"></div><details><summary>如何获取 API 密钥？</summary><ol><li>点击下方按钮，在官网登录你要连接的账户。</li><li>进入 API Keys，创建密钥并复制；已有可用密钥也可直接使用。</li><li>回到 Quanta，粘贴密钥，再点击“测试并保存”。</li></ol><div class="note" id="account-note"></div></details><button class="key-page" id="key-page">打开官方密钥页面 ↗</button><div id="key-result" role="status"></div><button id="save">测试并保存</button><div id="result" role="status" aria-live="polite"></div><p class="note">仅向所选服务的官方接口查询用量，不发送聊天或模型生成请求。测试成功后保存到本机系统钥匙串，不写入配置文件，也不上传到 Quanta 服务器。新密钥验证失败会保留原连接。</p>
<button id="authorize-keychain" type="button">允许访问已保存的钥匙串连接</button><script>
const $=id=>document.getElementById(id);let states={};let busy=false;
function render(){const glm=$('provider').value==='glm';$('region').hidden=!glm;$('account-note').textContent=glm?'请选择持有 GLM Coding Plan 的账户及对应区域；普通 API 余额不等于 Coding Plan 额度。':'这里连接的是 DeepSeek 开放平台 API 账户，用于查看 API 余额。';$('key-page').textContent='打开 '+(glm?($('platform').value==='zai'?'Z.ai':'BigModel'):'DeepSeek')+' 官方密钥页面 ↗';const state=busy?'正在验证…':(states[$('provider').value]||'未连接');$('status').textContent=state;$('status').className='status '+(state==='已连接'?'connected':(state==='未连接'||state.startsWith('连接失败')?'disconnected':'pending'));$('destination').textContent='密钥仅发送至：'+(glm?($('platform').value==='zai'?'api.z.ai':'open.bigmodel.cn'):'api.deepseek.com');}
window.keyPageResult=message=>{$('key-result').textContent=message};$('key-page').onclick=()=>window.webkit.messageHandlers.quanta.postMessage({action:'open-key-page',provider:$('provider').value,platform:$('platform').value});
$('provider').onchange=()=>{$('secret').value='';$('result').textContent='';$('key-result').textContent='';render()};$('platform').onchange=()=>{$('secret').value='';$('result').textContent='';$('key-result').textContent='';render()};
window.connectionState=data=>{states=data;render()};
window.connectionResult=data=>{busy=false;for(const id of ['save','provider','platform','secret'])$(id).disabled=false;$('save').textContent='测试并保存';$('result').textContent=data.message;if(data.ok){states[data.provider]='已连接';$('secret').value=''}render()};
$('authorize-keychain').onclick=()=>{if(busy)return;busy=true;render();window.webkit.messageHandlers.quanta.postMessage({action:'authorize-keychain',provider:$('provider').value})};
$('save').onclick=()=>{if(busy)return;const secret=$('secret').value.trim();if(!secret){$('result').textContent='请输入密钥。';$('secret').focus();return}busy=true;for(const id of ['save','provider','platform','secret'])$(id).disabled=true;$('save').textContent='正在测试…';$('result').textContent='正在查询官方接口…';render();window.webkit.messageHandlers.quanta.postMessage({action:'connect-save',provider:$('provider').value,platform:$('platform').value,secret});$('secret').value=''};render();
</script></body></html>
