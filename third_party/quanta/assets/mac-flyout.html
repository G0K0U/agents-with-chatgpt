<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Quanta · 用量总览</title>
<style>
:root{color-scheme:dark;--bg:#101318;--card:#191e26;--line:#2a313c;--text:#f0f3f8;--muted:#9ca8b8;--blue:#85b6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#202732;transition:background .15s}button:hover{background:#2b3645}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button:disabled{opacity:.5;cursor:wait}.shell{height:100vh;display:flex;flex-direction:column}header{padding:16px 17px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex:none}.brand{width:25px;height:25px;flex:none}.heading{flex:1}h1{font-size:19px;letter-spacing:-.5px;margin:0 0 3px;font-weight:650}.subtitle{font-size:11px;color:var(--muted)}.icon-button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}.icon-button svg{width:16px;height:16px}.spinning svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}main{padding:13px 13px 4px;overflow:auto;flex:1;min-height:0}.section-heading{font-size:11px;color:var(--muted);letter-spacing:.4px;display:flex;justify-content:space-between;margin:0 4px 11px}.live{display:inline-flex;align-items:center;gap:5px}.live:before{content:"";width:5px;height:5px;border-radius:50%;background:#8294ad}.card{padding:11px 12px 10px;background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px}.card-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}.source-dot{width:7px;height:7px;border-radius:50%;flex:none}.source-name{font-weight:600;font-size:13px;flex:1;overflow-wrap:anywhere}.source-type{font-size:10px;color:var(--muted);white-space:nowrap;background:#242c37;border-radius:5px;padding:3px 5px}.bar-row{margin:7px 0 9px}.bar-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;gap:8px}.window-label{color:#c7d0dd;font-size:11px}.remaining{font-size:16px;font-weight:650;letter-spacing:-.4px;font-variant-numeric:tabular-nums}.remaining small{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}.track{height:4px;background:#2c3441;border-radius:4px;overflow:hidden}.fill{height:100%;border-radius:4px;transition:width .3s}.detail{font-size:11px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}.headline{font-size:16px;font-weight:600;margin:4px 0 6px}.card.no-bars .headline{font-size:12px;font-weight:500}.empty{color:var(--muted);padding:35px 12px;line-height:1.8;text-align:center}.notice{font-size:11px;line-height:1.5;padding:10px 12px;border-radius:8px;background:#27303b;color:#cbd8ea;margin-bottom:10px;overflow-wrap:anywhere}.notice.error{background:#3a2529;color:#ffadb0}.legend{padding:13px 15px;background:#191e26;border:1px solid var(--line);border-radius:11px;margin:6px 0 10px}.legend h2{font-size:12px;margin:0 0 10px}.legend p{margin:6px 0;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.swatch{display:inline-block;width:7px;height:7px;border-radius:50%}footer{padding:10px 13px 12px;border-top:1px solid var(--line);background:#14191f;flex:none}.actions{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:7px;margin-bottom:10px}.actions button{height:32px;border-radius:8px;font-size:12px}.actions .primary{background:#284974;border-color:#3b6090;color:#e4efff}.actions .primary:hover{background:#355c8f}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.startup{display:flex;align-items:center;gap:8px;background:none;border:0;padding:3px 0;color:var(--muted);font-size:11px}.switch{width:25px;height:15px;border-radius:8px;background:#39414e;padding:2px;display:inline-flex}.switch:before{content:"";width:11px;height:11px;background:#e5e9ef;border-radius:50%;transition:transform .15s}.startup[aria-checked=true] .switch{background:#3b81cc}.startup[aria-checked=true] .switch:before{transform:translateX(10px)}.quit{border:0;background:none;color:var(--muted);font-size:11px;padding:5px}.footnote{font-size:10px;color:#727f90;margin-top:9px;text-align:center}[hidden]{display:none!important}
</style></head><body><div class="shell">
<header><svg class="brand" viewBox="125 130 780 780" aria-hidden="true"><path fill="#edf4ff" d="M 785 726 A 350 350 0 1 0 644 835 L 682 873 H 855 L 648 663 A 202 202 0 1 1 681 621 Z"/></svg><div class="heading"><h1>Quanta</h1><div class="subtitle" id="updated">正在读取本机用量…</div></div><button class="icon-button" id="refresh" data-action="refresh" aria-label="立即刷新" title="立即刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-5L4 9m16 6-3 3A7 7 0 0 1 5 13"/></svg></button></header>
<main><div class="section-heading"><span>订阅与活动</span><span class="live" id="state">本机数据</span></div><div id="error" class="notice error" role="status" hidden></div><div id="feedback" class="notice" role="status" hidden></div><div id="cards"><div class="empty">读取完成后，用量窗口和剩余进度将显示在这里。</div></div>
<section class="legend" id="legend" hidden><h2>颜色说明</h2><p><i class="swatch" style="background:#2ea043"></i>绿色：剩余超过 50%</p><p><i class="swatch" style="background:#d29922"></i>黄色：剩余超过 20%，不超过 50%</p><p><i class="swatch" style="background:#da3633"></i>红色：剩余 20% 或更少</p><p><i class="swatch" style="background:#6e7681"></i>灰色：未知、过期或读取失败</p><p><i class="swatch" style="background:#2d7ed2"></i>蓝色：余额；不换算为额度</p><p id="muse-legend" hidden><i class="swatch" style="background:#a371f7"></i>紫色：Token 用量与活动计数；非剩余额度</p></section></main>
<footer><div class="actions"><button class="primary" data-action="panel">打开详情 ↗</button><button id="redetect" data-action="redetect">检测来源</button><button id="legend-toggle" aria-expanded="false">颜色说明</button></div><div class="bottom"><button class="startup" id="startup" data-action="autostart" role="switch" aria-checked="false"><span class="switch" aria-hidden="true"></span>登录时启动</button><button class="quit" data-action="quit">退出 Quanta</button></div><div class="footnote">进度条显示剩余额度 · 余额和活动计数单独显示</div></footer></div>
<script>
const $=id=>document.getElementById(id);
function send(action){window.webkit?.messageHandlers?.quanta?.postMessage(action)}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.action)));
$('legend-toggle').addEventListener('click',()=>{const show=$('legend').hidden;$('legend').hidden=!show;$('legend-toggle').setAttribute('aria-expanded',String(show));send('legend');if(show)$('legend').scrollIntoView({block:'nearest',behavior:'smooth'})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')send('close')});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function notice(id,text){$(id).textContent=text||'';$(id).hidden=!text}
window.updateData=function(data){
 $('muse-legend').hidden=!data.show_muse_legend;
 $('updated').textContent=data.updated||'尚未刷新';$('state').textContent=data.refreshing?'正在刷新…':'本机数据';
 $('refresh').disabled=!!data.refreshing;$('redetect').disabled=!!data.refreshing;$('refresh').classList.toggle('spinning',!!data.refreshing);
 $('startup').setAttribute('aria-checked',String(!!data.startup));notice('error',data.error);notice('feedback',data.feedback);
 const cards=document.createDocumentFragment();
 for(const card of data.cards||[]){
  const section=el('section',card.bars.length?'card':'card no-bars'),head=el('div','card-head'),dot=el('span','source-dot');dot.style.background=card.color;
  head.append(dot,el('div','source-name',card.name),el('span','source-type',card.bars.length?'剩余额度':'状态与活动'));section.append(head);
  for(const bar of card.bars){
   const row=el('div','bar-row'),heading=el('div','bar-heading'),value=el('span','remaining',`${Math.round(bar.remaining)}%`);value.append(el('small','', '剩余'));heading.append(el('span','window-label',bar.label),value);
   const track=el('div','track'),fill=el('div','fill');track.setAttribute('role','progressbar');track.setAttribute('aria-label',bar.label+'剩余额度');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','100');track.setAttribute('aria-valuenow',String(bar.remaining));fill.style.width=bar.remaining+'%';fill.style.background=bar.color;track.append(fill);row.append(heading,track);section.append(row);
  }
  if(!card.bars.length&&card.headline)section.append(el('div','headline',card.headline));
  if(card.detail)section.append(el('div','detail',card.detail));cards.append(section);
 }
 if(!data.cards?.length)cards.append(el('div','empty','尚未检测到可用来源。使用“检测来源”重新检查本机登录与应用状态。'));
 $('cards').replaceChildren(cards);
};
</script></body></html>
