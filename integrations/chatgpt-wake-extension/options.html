<!doctype html>
<html lang="en"><meta charset="utf-8"><title>A2C Wake Setup</title>
<body><h1>A2C Local Wake</h1>
<p>Choose a dedicated, signed-in ordinary ChatGPT conversation with connected A2C tools. Pending audits will submit compact wake messages there.</p>
<form id="setup">
<p><label>Conversation URL <input id="conversation" type="url" required size="75"></label></p>
<p><label>Local credential.json <input id="credential" type="file" accept="application/json,.json"></label></p>
<button>Save and enable</button><button type="button" id="disable">Disable and forget credential</button>
</form><p id="status" role="status"></p><script type="module" src="options.js"></script></body></html>
